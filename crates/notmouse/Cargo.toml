[package]
name = "notmouse"
description = "Keyboard-first interaction layer for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["accessibility", "keyboard", "mouse", "wayland", "gnome"]
categories = ["command-line-utilities", "accessibility"]
readme = "../../README.md"

[dependencies]
notmouse-core = { path = "../notmouse-core" }
evdev = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
gtk4 = { version = "0.10", features = ["v4_12"] }
cairo = { package = "cairo-rs", version = "0.21" }
pango = "0.21"
pangocairo = "0.21"
async-recursion = "1.1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies"] }
rstar = "0.13"
zbus = "5"

[lints]
workspace = true
